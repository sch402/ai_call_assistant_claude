# XcodeGen 配置。在 Mac 上：brew install xcodegen，然后在 ios/ 目录运行 xcodegen generate，
# 会生成 CallAssistant.xcodeproj。改了这个文件或增删源码文件后重新运行一次即可。
name: CallAssistant
options:
  bundleIdPrefix: com.homeau
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # 苹果开发者团队（Team ID 3YDFH675B7）。这里要填 10 位 Team ID（不是团队名称），
    # 在 developer.apple.com › Account › Membership details 里查看。填好后 xcodegen generate 不用再手动选 Team。
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3YDFH675B7
    # 后端（Vercel）域名，不带 https://。会写进 Info.plist，App 不再让用户填写。
    API_HOST: aicallassistantclaude.vercel.app
    # App Store Connect 里创建的自动续期订阅产品 ID，逗号分隔，按这个顺序展示在订阅页
    IAP_PRODUCT_IDS: com.homeau.callassistant.pro.monthly,com.homeau.callassistant.pro.yearly

targets:
  CallAssistant:
    type: application
    platform: iOS
    sources:
      - path: CallAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homeau.callassistant
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    # 推送通知能力。自动签名会把 Push Notifications 加到 App ID 上；打包上传 App Store 时会自动换成 production。
    entitlements:
      path: CallAssistant/CallAssistant.entitlements
      properties:
        aps-environment: development
    info:
      path: CallAssistant/Info.plist
      properties:
        CFBundleDisplayName: 来电助手
        APIHost: $(API_HOST)
        NSContactsUsageDescription: 用来在来电记录里显示通讯录中保存的名字。通讯录只在这台手机上匹配，不会上传。
        IAPProductIDs: $(IAP_PRODUCT_IDS)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false

  CallAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CallAssistantTests
    dependencies:
      - target: CallAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homeau.callassistant.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CallAssistant:
    build:
      targets:
        CallAssistant: all
        CallAssistantTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [CallAssistantTests]
