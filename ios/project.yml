# XcodeGen 配置。在 Mac 上：brew install xcodegen，然后在 ios/ 目录运行 xcodegen generate，
# 会生成 CallAssistant.xcodeproj。改了这个文件或增删源码文件后重新运行一次即可。
name: CallAssistant
options:
  bundleIdPrefix: com.sch402
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 在 Xcode 的 Signing & Capabilities 里选择你的 Team，或在这里填写 Team ID
    DEVELOPMENT_TEAM: ""
    # 后端（Vercel）域名，不带 https://。会写进 Info.plist，App 不再让用户填写。
    API_HOST: aicallassistantclaude.vercel.app

targets:
  CallAssistant:
    type: application
    platform: iOS
    sources:
      - path: CallAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sch402.callassistant
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: CallAssistant/Info.plist
      properties:
        CFBundleDisplayName: 来电助手
        APIHost: $(API_HOST)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false

  CallAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CallAssistantTests
    dependencies:
      - target: CallAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sch402.callassistant.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CallAssistant:
    build:
      targets:
        CallAssistant: all
        CallAssistantTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [CallAssistantTests]
